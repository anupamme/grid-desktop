<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <defs>
    <!-- Widget kártya háttér és keret stílusok -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#0f0f12" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Widget fő doboz -->
  <rect x="6" y="6" width="228" height="188" rx="14" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- Fejléc: Ikon + Hardwerinfo felirat -->
  <g transform="translate(16, 15)">
    <!-- Switch / Slider stílusú fejléc ikon -->
    <rect x="0" y="1" width="14" height="8" rx="4" fill="none" stroke="#e0e0e0" stroke-width="1.2" opacity="0.85" />
    <circle cx="4" cy="5" r="2.2" fill="#e0e0e0" opacity="0.85" />
    <text x="20" y="9" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">Hardwerinfo</text>
  </g>

  <!-- Görgetősáv (Jobb oldalon) -->
  <rect x="223" y="36" width="3.5" height="108" rx="1.75" fill="rgba(255, 255, 255, 0.28)" />

  <!-- 1. Kártya: Host Modell -->
  <g transform="translate(16, 34)">
    <rect width="202" height="23" rx="5" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
    <!-- Kijelző / Computer ikon -->
    <rect x="8" y="5.5" width="11" height="8" rx="1" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.8" />
    <line x1="11" y1="14.5" x2="16" y2="14.5" stroke="#ffffff" stroke-width="1.1" opacity="0.8" />
    <text x="26" y="15" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" opacity="0.9">HP EliteBook 850 G7</text>
  </g>

  <!-- 2. Kártya: GPU -->
  <g transform="translate(16, 61)">
    <rect width="202" height="23" rx="5" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
    <!-- GPU / Display ikon -->
    <rect x="8" y="5.5" width="11" height="8" rx="1" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.8" />
    <line x1="11" y1="14.5" x2="16" y2="14.5" stroke="#ffffff" stroke-width="1.1" opacity="0.8" />
    <text x="26" y="15" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" opacity="0.9">Intel Graphics</text>
  </g>

  <!-- 3. Kártya: CPU -->
  <g transform="translate(16, 88)">
    <rect width="202" height="23" rx="5" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
    <!-- CPU zöld matrica ikon -->
    <rect x="8" y="5.5" width="11" height="11" rx="2" fill="#5b9b42" />
    <rect x="10.5" y="8" width="6" height="6" rx="1" fill="none" stroke="#ffffff" stroke-width="0.8" />
    <text x="26" y="15" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" opacity="0.9">Intel i5-10310U (4C/8T)</text>
  </g>

  <!-- 4. Kártya: RAM -->
  <g transform="translate(16, 115)">
    <rect width="202" height="23" rx="5" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
    <!-- RAM modul ikon -->
    <rect x="8" y="7" width="12" height="7" rx="1" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    <line x1="10" y1="12" x2="10" y2="14" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    <line x1="12" y1="12" x2="12" y2="14" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    <line x1="14" y1="12" x2="14" y2="14" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    <line x1="16" y1="12" x2="16" y2="14" stroke="#ffffff" stroke-width="1" opacity="0.8" />
    <text x="26" y="15" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" opacity="0.9">16 GB RAM</text>
  </g>

  <!-- 5. Kártya: OS -->
  <g transform="translate(16, 142)">
    <rect width="202" height="23" rx="5" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" />
    <!-- Debian spirál ikon -->
    <rect x="8" y="6" width="11" height="11" rx="2.5" fill="#d70a53" />
    <path d="M13.5 8.5 C12 7.5, 10 9, 11 11 C11.5 12, 13 12, 13 13.5 C13 14.5, 11 14.5, 10.5 13.5" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" />
    <text x="26" y="15" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" opacity="0.9">Debian GNU/Linux 13 (trixie)</text>
  </g>

  <!-- 6. Kártya: Periféria (alsó, félig látszó kártya) -->
  <g transform="translate(16, 169)">
    <rect width="202" height="23" rx="5" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1" opacity="0.7" />
    <!-- Thunderbolt / Villám ikon -->
    <path d="M13.5 5.5 L9.5 11 L13 11 L11.5 16.5 L16.5 10 L13 10 Z" fill="#ffffff" opacity="0.8" />
    <text x="26" y="15" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" opacity="0.7">HP USB-C Dock G5</text>
  </g>
</svg>