<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Widget egységes háttér -->
  <rect x="8" y="8" width="104" height="104" rx="16" fill="#212126" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Fejléc (letöltés ikon + vonal a címnek) -->
  <g transform="translate(18, 18)">
    <circle cx="8" cy="8" r="7" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.85" />
    <path d="M8 4.5 v5 M6 7.5 l2 2.5 l2 -2.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <rect x="20" y="5" width="42" height="6" rx="3" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- 1. sor kártyák -->
  <g transform="translate(18, 38)">
    <!-- 1. kártya: mappa -->
    <rect x="0" y="0" width="24" height="28" rx="5" fill="url(#card)" />
    <path d="M5 8 h4 l2 2 h8 v7 h-14 z" fill="#3584e4" opacity="0.9" />
    <rect x="4" y="21" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.4" />

    <!-- 2. kártya: archívum / dokumentum -->
    <rect x="30" y="0" width="24" height="28" rx="5" fill="url(#card)" />
    <rect x="35" y="7" width="14" height="12" rx="2" fill="#e66100" opacity="0.9" />
    <rect x="34" y="21" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.4" />

    <!-- 3. kártya: kép preview -->
    <rect x="60" y="0" width="24" height="28" rx="5" fill="url(#card)" />
    <rect x="65" y="7" width="14" height="12" rx="2" fill="#9141ac" opacity="0.85" />
    <circle cx="69" cy="11" r="1.5" fill="#ffffff" opacity="0.9" />
    <rect x="64" y="21" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- 2. sor kártyák -->
  <g transform="translate(18, 72)">
    <!-- 4. kártya: dokumentum -->
    <rect x="0" y="0" width="24" height="28" rx="5" fill="url(#card)" />
    <rect x="5" y="7" width="14" height="12" rx="2" fill="#1c71d8" opacity="0.9" />
    <rect x="4" y="21" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.4" />

    <!-- 5. kártya: kép -->
    <rect x="30" y="0" width="24" height="28" rx="5" fill="url(#card)" />
    <rect x="35" y="7" width="14" height="12" rx="2" fill="#2ec27e" opacity="0.85" />
    <rect x="34" y="21" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.4" />

    <!-- 6. kártya: pdf preview -->
    <rect x="60" y="0" width="24" height="28" rx="5" fill="url(#card)" />
    <rect x="65" y="7" width="14" height="12" rx="2" fill="#f66151" opacity="0.9" />
    <rect x="64" y="21" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Görgetősáv szimbolizálása -->
  <rect x="106" y="42" width="2.5" height="32" rx="1.25" fill="#ffffff" opacity="0.3" />
</svg>