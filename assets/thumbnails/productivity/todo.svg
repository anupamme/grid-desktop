<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <defs>
    <linearGradient id="todoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="100%" stop-color="#0f0f12" />
    </linearGradient>
  </defs>

  <!-- Fő widget doboz -->
  <rect x="6" y="6" width="228" height="188" rx="14" fill="url(#todoBgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- Fejléc: Pipa ikon + To-Do felirat + Hozzáadás (+) gomb -->
  <g transform="translate(18, 16)">
    <!-- Pipa ikon négyzetben -->
    <rect x="0" y="2" width="14" height="14" rx="3" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.9" />
    <path d="M3.5 9 L6 11.5 L10.5 5.5" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    
    <!-- Cím -->
    <text x="21" y="14" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" opacity="0.95">To-Do</text>

    <!-- Jobb felső kerek hozzáadás gomb -->
    <circle cx="196" cy="9" r="9" fill="rgba(255, 255, 255, 0.12)" />
    <line x1="196" y1="5.5" x2="196" y2="12.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <line x1="192.5" y1="9" x2="199.5" y2="9" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Görgetősáv a jobb oldalon -->
  <rect x="221" y="44" width="4" height="100" rx="2" fill="rgba(255, 255, 255, 0.28)" />

  <!-- 1. Feladat: Aktív (Make tea) -->
  <g transform="translate(16, 44)">
    <rect width="198" height="38" rx="12" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <!-- Üres kör -->
    <circle cx="20" cy="19" r="8.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    <!-- Szöveg -->
    <text x="38" y="23" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" opacity="0.95">Make tea</text>
    <!-- Törlés (X) -->
    <line x1="180" y1="15" x2="186" y2="21" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
    <line x1="186" y1="15" x2="180" y2="21" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
  </g>

  <!-- 2. Feladat: Aktív (Make cake) -->
  <g transform="translate(16, 90)">
    <rect width="198" height="38" rx="12" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <!-- Üres kör -->
    <circle cx="20" cy="19" r="8.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    <!-- Szöveg -->
    <text x="38" y="23" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" opacity="0.95">Make cake</text>
    <!-- Törlés (X) -->
    <line x1="180" y1="15" x2="186" y2="21" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
    <line x1="186" y1="15" x2="180" y2="21" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
  </g>

  <!-- 3. Feladat: Aktív (Linux os) -->
  <g transform="translate(16, 136)">
    <rect width="198" height="38" rx="12" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <!-- Üres kör -->
    <circle cx="20" cy="19" r="8.5" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    <!-- Szöveg -->
    <text x="38" y="23" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" opacity="0.95">Linux os</text>
    <!-- Törlés (X) -->
    <line x1="180" y1="15" x2="186" y2="21" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
    <line x1="186" y1="15" x2="180" y2="21" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.45" />
  </g>
</svg>