<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <!-- Lekerekített kártya clip mask a biztonság kedvéért -->
    <clipPath id="cardClip">
      <rect width="240" height="140" rx="16" ry="16" />
    </clipPath>
  </defs>

  <!-- Kártya háttér és keret -->
  <rect width="240" height="140" rx="16" ry="16" fill="#1e1e22" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Fejléc Pill: ● EUR / HUF -->
  <g transform="translate(16, 16)">
    <rect width="78" height="18" rx="9" fill="rgba(255, 255, 255, 0.08)" />
    <circle cx="9" cy="9" r="3" fill="#81c784" />
    <text x="18" y="12.5" fill="#ffffff" font-family="sans-serif" font-size="8.5" font-weight="bold" letter-spacing="0.6">EUR / HUF</text>
  </g>

  <!-- Bal oldal: Árfolyam és Badge -->
  <!-- Nagy érték -->
  <text x="16" y="68" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">366.15</text>

  <!-- Százalékos badge + deviza kód -->
  <g transform="translate(16, 76)">
    <rect width="44" height="14" rx="3.5" fill="rgba(76, 175, 80, 0.22)" />
    <text x="5" y="10.5" fill="#81c784" font-family="sans-serif" font-size="8.5" font-weight="bold">+1.07%</text>
    <text x="50" y="11" fill="rgba(255, 255, 255, 0.6)" font-family="sans-serif" font-size="9.5" font-weight="bold">HUF</text>
  </g>

  <!-- Jobb oldal: 30 napos Cairo Sparkline vonal -->
  <path d="M 124,78 
           L 130,88 
           L 135,74 
           L 142,70 
           L 148,65 
           L 154,67 
           L 159,77 
           L 165,76 
           L 171,74 
           L 178,72 
           L 184,75 
           L 190,69 
           L 196,77 
           L 201,81 
           L 208,76 
           L 214,70 
           L 220,64" 
        fill="none" 
        stroke="#81c784" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Lábléc szöveg -->
  <text x="16" y="122" fill="rgba(255, 255, 255, 0.45)" font-family="sans-serif" font-size="7.5">30-day trend · Frankfurter API</text>
</svg>
